<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="20" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8063a8"/>
      <stop offset=".42" stop-color="#493461"/>
      <stop offset="1" stop-color="#21172f"/>
    </linearGradient>
    <linearGradient id="tileGlow" x1="24" y1="9" x2="102" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#ded1fb" stop-opacity=".11"/>
      <stop offset="1" stop-color="#baa3f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="40" y1="5" x2="66" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".48"/>
      <stop offset=".36" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="route" x1="28" y1="22" x2="101" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1e7ff"/>
      <stop offset=".5" stop-color="#c7a9f4"/>
      <stop offset="1" stop-color="#a991eb"/>
    </linearGradient>
    <linearGradient id="avatar" x1="34" y1="47" x2="93" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8edff"/>
      <stop offset="1" stop-color="#d9d0f4"/>
    </linearGradient>
    <linearGradient id="avatarLine" x1="36" y1="42" x2="96" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#cbb9f0" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="person" x1="37" y1="47" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74449a"/>
      <stop offset="1" stop-color="#522968"/>
    </linearGradient>
    <filter id="softShadow" x="13" y="14" width="102" height="103" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="orbHighlightBlur" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="orbClip"><circle cx="64" cy="64" r="59"/></clipPath>
  </defs>

  <!-- A round glass lens keeps the account-routing mark distinct from the old square tile. -->
  <circle cx="64" cy="64" r="60" fill="#140c20" fill-opacity=".54"/>
  <g clip-path="url(#orbClip)">
    <circle cx="64" cy="64" r="59" fill="url(#tile)"/>
    <circle cx="64" cy="64" r="59" fill="url(#tileGlow)"/>
    <ellipse cx="42" cy="8" rx="47" ry="18" fill="#fff" fill-opacity=".22" filter="url(#orbHighlightBlur)"/>
    <path d="M8 47C20 16 44 6 68 6c23 0 42 8 54 25C94 22 49 28 8 63Z" fill="url(#glassReflection)"/>
    <path d="M16 34C28 15 48 8 70 8" fill="none" stroke="#fff" stroke-opacity=".62" stroke-linecap="round" stroke-width="2.2"/>
    <path d="M109 93c-10 18-27 27-47 28" fill="none" stroke="#d8c7fb" stroke-opacity=".34" stroke-linecap="round" stroke-width="1.6"/>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#fff" stroke-opacity=".60" stroke-width="2"/>
  <circle cx="64" cy="64" r="56.5" fill="none" stroke="#d4c1f7" stroke-opacity=".20" stroke-width="1"/>

  <!-- Two account nodes are joined by a quiet, bidirectional switching route. -->
  <path d="M29 55c0-17 14-30 31-30h20" fill="none" stroke="#211329" stroke-opacity=".34" stroke-linecap="round" stroke-width="9" filter="url(#softShadow)"/>
  <path class="brand-exchange-track brand-exchange-upper" d="M29 55c0-17 14-30 31-30h20" fill="none" stroke="url(#route)" stroke-linecap="round" stroke-width="5"/>
  <path class="brand-exchange-flow brand-exchange-flow-upper" d="M29 55c0-17 14-30 31-30h20" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="1.5" stroke-dasharray="13 108"/>
  <path d="m74 17 11 8-11 8" fill="none" stroke="url(#route)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

  <path d="M99 73c0 17-14 30-31 30H48" fill="none" stroke="#211329" stroke-opacity=".34" stroke-linecap="round" stroke-width="9" filter="url(#softShadow)"/>
  <path class="brand-exchange-track brand-exchange-lower" d="M99 73c0 17-14 30-31 30H48" fill="none" stroke="url(#route)" stroke-linecap="round" stroke-width="5"/>
  <path class="brand-exchange-flow brand-exchange-flow-lower" d="M99 73c0 17-14 30-31 30H48" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="1.5" stroke-dasharray="13 108"/>
  <path d="m54 95-11 8 11 8" fill="none" stroke="url(#route)" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

  <g class="brand-account-node brand-account-node-left">
    <circle cx="45" cy="64" r="19" fill="#180e22" fill-opacity=".35"/>
    <circle cx="45" cy="62" r="17" fill="url(#avatar)" stroke="url(#avatarLine)" stroke-width="2"/>
    <circle cx="45" cy="57.5" r="4.1" fill="url(#person)"/>
    <path d="M36.4 70c1-4.5 4.2-6.9 8.6-6.9s7.6 2.4 8.6 6.9" fill="url(#person)"/>
  </g>
  <g class="brand-account-node brand-account-node-right">
    <circle cx="83" cy="66" r="19" fill="#180e22" fill-opacity=".38"/>
    <circle cx="83" cy="64" r="17" fill="url(#avatar)" stroke="url(#avatarLine)" stroke-width="2"/>
    <circle cx="83" cy="59.5" r="4.1" fill="url(#person)"/>
    <path d="M74.4 72c1-4.5 4.2-6.9 8.6-6.9s7.6 2.4 8.6 6.9" fill="url(#person)"/>
    <circle class="brand-active-indicator" cx="94" cy="76" r="4.1" fill="#9476e7" stroke="#fff" stroke-width="1.5"/>
  </g>
</svg>
